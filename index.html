    <!-- ================= AI FEATURES: ONE LINE TO TURN THEM ON =================
         Document / URL import, auto-map, and question generation all POST to the
         Anthropic Messages API. On a static host those calls carry no credentials, so
         they MUST go through your own authenticated proxy. Until this line is live, the
         app degrades cleanly: it shows a named diagnosis (not "network error"), offers
         the manual-feature fallback, and the whole deterministic core — dimension map,
         corridors, the 12x12 matrix, the timeline, every export — keeps working.

         To enable: deploy worker/ (README, Tier 2), then UNCOMMENT the line below and
         paste the full URL INCLUDING the secret path segment. No trailing slash — the
         Worker matches that segment exactly (the app now strips one for you anyway).
         Verify first by opening the same URL in a browser tab: the Worker answers a GET
         with a JSON health check, so you can confirm the path and the key for free.

         Prefer not to rebuild? Run the app and paste the URL into the field in the
         yellow banner instead: it applies immediately and is remembered in that browser.
         ========================================================================= -->
